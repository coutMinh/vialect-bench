zero_shot_llms:
  - name: Qwen 2.5 0.5B Instruct
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    notes: Small smoke-test model for checking the probing pipeline on Colab.
  - name: Qwen 2.5 3B Instruct
    model_id: Qwen/Qwen2.5-3B-Instruct
    notes: Better Colab-scale probe model; use this before trying 7B.
  - name: Qwen 2.5 7B Instruct
    model_id: Qwen/Qwen2.5-7B-Instruct
    notes: Strong multilingual open instruct model; run zero-shot prompts.
  - name: Gemma 2 9B IT
    model_id: google/gemma-2-9b-it
    notes: Open instruct family; may require accepting Google license on Hugging Face.
  - name: Gemma 3 4B IT
    model_id: google/gemma-3-4b-it
    notes: Newer Gemma instruction-tuned model at the 4B scale; requires accepting Google's Gemma license on Hugging Face.
  - name: Llama 3.1 8B Instruct
    model_id: meta-llama/Llama-3.1-8B-Instruct
    notes: Open instruct family; may require accepting Meta license on Hugging Face.
  - name: Mistral 7B Instruct v0.3
    model_id: mistralai/Mistral-7B-Instruct-v0.3
    notes: Open instruct family; useful non-Asian multilingual baseline.
  - name: Vistral 7B Chat
    model_id: Viet-Mistral/Vistral-7B-Chat
    notes: Vietnamese-oriented LLM candidate; verify availability before running.
  - name: SeaLLM 7B Chat
    model_id: SeaLLMs/SeaLLMs-v3-7B-Chat
    notes: Southeast Asian multilingual LLM candidate; verify availability before running.
  - name: GPT-4o
    provider: openai
    model_id: gpt-4o
    notes: Closed-source OpenAI API model; requires OPENAI_API_KEY and an API runner.

